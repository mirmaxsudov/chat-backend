spring:
  application:
    name: chat
  profiles:
    active: dev

logging:
  file:
    path: ${LOG_DIR:logs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

app:
  logging:
    time-zone: ${LOG_TIME_ZONE:Asia/Tashkent}
  security:
    jwt:
      secret-key: ${secrets.jwt.secret-key}
      access-expiration-ms: ${secrets.jwt.access-expiration-ms}
      refresh-expiration-ms: ${secrets.jwt.refresh-expiration-ms}
      issuer: chat-clone-backend
      audience: chat-clone-api
    cors:
      allowed-origins: http://localhost:3000

attachments:
  media-preview:
    enabled: ${MEDIA_PREVIEW_ENABLED:true}
    max-width: ${MEDIA_PREVIEW_MAX_WIDTH:640}
    max-height: ${MEDIA_PREVIEW_MAX_HEIGHT:960}
    jpeg-quality: ${MEDIA_PREVIEW_JPEG_QUALITY:0.70}
    max-source-pixels: ${MEDIA_PREVIEW_MAX_SOURCE_PIXELS:250000000}
    max-attempts: ${MEDIA_PREVIEW_MAX_ATTEMPTS:3}
    recovery-batch-size: ${MEDIA_PREVIEW_RECOVERY_BATCH_SIZE:100}
    processing-timeout: ${MEDIA_PREVIEW_PROCESSING_TIMEOUT:10m}
    recovery-interval-ms: ${MEDIA_PREVIEW_RECOVERY_INTERVAL_MS:60000}
    recovery-initial-delay-ms: ${MEDIA_PREVIEW_RECOVERY_INITIAL_DELAY_MS:30000}
    core-pool-size: ${MEDIA_PREVIEW_CORE_POOL_SIZE:1}
    max-pool-size: ${MEDIA_PREVIEW_MAX_POOL_SIZE:2}
    queue-capacity: ${MEDIA_PREVIEW_QUEUE_CAPACITY:50}

springwolf:
  use-fqn: false
  docket:
    base-package: uz.mirmaxsudov.chatclonebackend
    info:
      title: Chat Realtime API
      version: 1.0.0
      description: Receive-only STOMP events for direct messages and saved messages. Message creation uses the REST API.
    servers:
      chat-websocket:
        host: localhost:8080
        protocol: ws
        pathname: /ws
        description: "Authenticate by sending Authorization: Bearer <JWT> in the STOMP CONNECT headers."
        security:
          - type: http
            description: JWT bearer token supplied in the STOMP CONNECT Authorization header.
  plugin:
    stomp:
      endpoint:
        user: /user
