spring:
  application:
    name: chat
  profiles:
    active: dev

logging:
  file:
    path: ${LOG_DIR:logs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}

app:
  logging:
    time-zone: ${LOG_TIME_ZONE:Asia/Tashkent}
  security:
    jwt:
      secret-key: ${secrets.jwt.secret-key}
      access-expiration-ms: ${secrets.jwt.access-expiration-ms}
      refresh-expiration-ms: ${secrets.jwt.refresh-expiration-ms}
      issuer: chat-clone-backend
      audience: chat-clone-api
    cors:
      allowed-origins: http://localhost:3000

attachments:
  video-thumbnail:
    enabled: ${VIDEO_THUMBNAIL_ENABLED:true}
    max-width: ${VIDEO_THUMBNAIL_MAX_WIDTH:640}
    core-pool-size: ${VIDEO_THUMBNAIL_CORE_POOL_SIZE:1}
    max-pool-size: ${VIDEO_THUMBNAIL_MAX_POOL_SIZE:2}
    queue-capacity: ${VIDEO_THUMBNAIL_QUEUE_CAPACITY:20}

springwolf:
  use-fqn: false
  docket:
    base-package: uz.mirmaxsudov.chatclonebackend
    info:
      title: Chat Realtime API
      version: 1.0.0
      description: Receive-only STOMP events for direct messages and saved messages. Message creation uses the REST API.
    servers:
      chat-websocket:
        host: localhost:8080
        protocol: ws
        pathname: /ws
        description: "Authenticate by sending Authorization: Bearer <JWT> in the STOMP CONNECT headers."
        security:
          - type: http
            description: JWT bearer token supplied in the STOMP CONNECT Authorization header.
  plugin:
    stomp:
      endpoint:
        user: /user
