spring:
  datasource:
    url: jdbc:h2:mem:chat-security-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  security:
    jwt:
      secret-key: test-only-secret-key-with-at-least-thirty-two-bytes
      access-expiration-ms: 900000
      refresh-expiration-ms: 604800000
      issuer: chat-clone-backend-test
      audience: chat-clone-api-test
    cors:
      allowed-origins: http://localhost:3000
